# Composite action: build the cmd/release-tool Go binary into
# $RUNNER_TEMP and export $RELEASE_TOOL for downstream steps.
#
# Extracted in PR-6 (#929) so the two callers (update-deps-pr,
# tag-all) stay byte-identical — drift between them risks the
# release-bot identity diverging across the workflow.
#
# Inputs / outputs intentionally none. The action mutates
# $GITHUB_ENV so subsequent steps in the same job see RELEASE_TOOL.
name: Build release-tool
description: >-
  Build the cmd/release-tool Go binary into $RUNNER_TEMP and export
  $RELEASE_TOOL for downstream steps in the same job.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        # cmd/release-tool is its own go.mod sub-module. Use its own
        # go.sum as the cache key so root-module changes don't
        # uselessly bust this cache, and the release-tool's actual
        # deps are what governs invalidation.
        go-version-file: cmd/release-tool/go.mod
        cache: true
        cache-dependency-path: cmd/release-tool/go.sum

    - name: Build release-tool
      shell: bash
      env:
        # Release-critical build: refuse silent go.sum mutation and
        # pin the proxy/checksum DB explicitly so a hostile runner
        # env can't substitute a malicious source.
        GOFLAGS: -mod=readonly
        GOPROXY: https://proxy.golang.org,direct
        GOSUMDB: sum.golang.org
      run: |
        set -euo pipefail
        (
          cd cmd/release-tool
          go build -trimpath -ldflags='-s -w' \
              -o "${RUNNER_TEMP}/release-tool" .
        )
        "${RUNNER_TEMP}/release-tool" --help >/dev/null
        echo "RELEASE_TOOL=${RUNNER_TEMP}/release-tool" >> "$GITHUB_ENV"
