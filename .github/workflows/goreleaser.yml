# Builds binaries, creates the GitHub Release, and attests build
# provenance for all artifacts (supply chain verification via
# `gh attestation verify`). SBOMs are not published — see #514 and
# `docs/releasing.md` "Software Bill of Materials" for the rationale.
#
# This workflow is for MANUAL RE-RUNS ONLY — the normal release flow
# runs GoReleaser as a job inside release.yml.
# Trigger manually on a v* tag ref if the goreleaser job in release.yml failed.
name: GoReleaser

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to (re-)run GoReleaser against, e.g. v0.2.2'
        type: string
        required: true

permissions:
  contents: read

# Shared concurrency group with release.yml (#516 devops review,
# PR-7 #943 BLOCKER-7 fix). release.yml uses
# `release-${{ inputs.version || github.ref_name }}` at the workflow
# level; the manual-rerun trigger here resolves to the SAME group via
# the required `version` input. Without a required input, dispatching
# from any branch produced `release-<branch>` (e.g. `release-main`),
# which did NOT match the automated tag flow's group — two release
# runs could race on the same GitHub Release / Sigstore identity.
# cancel-in-progress: false so a manual rerun queues behind an
# automated tag run rather than killing it mid-flight.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write      # required for attestation OIDC
      attestations: write   # required for attestation upload
    steps:
      - name: Validate version input
        # PR-7 (#943) BLOCKER-7 fix: a malformed version input would
        # produce `release-junk` as the concurrency group AND fetch
        # whatever ref happens to resolve. Refuse early with the same
        # regex tag-all.sh enforces, so a typo can't trigger a build.
        #
        # Build metadata (`v1.2.3+abc`) is deliberately rejected: the
        # Go module proxy treats `v1.2.3+meta` as a distinct version
        # from `v1.2.3` and downstream tooling (proxy.golang.org,
        # `go mod download`) breaks on it. The regex matches the
        # exact set Go's release pipeline accepts.
        #
        # The 64-char length cap is defence in depth — without it, a
        # 16KB string passing the regex would become a 16KB
        # concurrency-group name (GitHub silently truncates at 255
        # and groups with the same prefix collide).
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${#VERSION}" -gt 64 ]; then
            echo "::error::version input too long (${#VERSION} chars, max 64): '$VERSION'"
            exit 2
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::invalid version input: '$VERSION' (expected vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 2
          fi
          echo "version: $VERSION"

      - name: Checkout release tag
        # PR-7 (#943): pin to the tag commit, NOT the dispatcher's
        # branch. The previous `fetch-depth: 0` without `ref:` left
        # GoReleaser building from whatever ref the dispatcher
        # happened to be on, which for a manual rerun should be the
        # tag itself.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.version }}

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: tag must point to a commit on main"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up go.work
        run: make workspace

      # PR-12 (#952) fix: the v0.2.2 5th dispatch (27216652832) failed
      # at the docker push step with "unauthorized: unauthenticated:
      # User cannot be authenticated with the token provided".
      # GoReleaser's `dockers:` push needs the runner's local docker
      # CLI to be logged into ghcr.io BEFORE goreleaser runs — there
      # is no docker-login surface inside goreleaser-action's config.
      # docker/login-action is the standard pattern. Uses
      # ${{ github.actor }} + the auto-provisioned GITHUB_TOKEN
      # scoped via the workflow's `packages: write` permission.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sigstore keyless signing (#516). Installs cosign for the
      # GoReleaser `signs:` stanza. Pinned to v4.1.1 commit SHA.
      #
      # PR-10 (#950) fix: cosign-installer's default is "latest", which
      # currently pulls cosign ≥ v2.6. That release made
      # --new-bundle-format the silent default — --output-signature
      # and --output-certificate are warned-and-ignored, and cosign
      # tries to write a combined .bundle to the path passed via
      # --bundle (which we don't pass), so it fails with
      # "create bundle file: open : no such file or directory".
      # The v0.2.2 dispatch (runs 27194413670 + 27196997175) failed
      # exactly here. Pin to v2.5.3 — the last v2.5 release — so
      # --output-signature / --output-certificate continue to write
      # the .sig / .pem layout that docs/releasing.md's verifier
      # recipe depends on. v0.2.3 will migrate to the bundle format
      # + update the verifier docs as a proper fix.
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: 'v2.5.3'

      - name: Run GoReleaser
        id: goreleaser
        # --skip=before added for v0.2.2 (#948): the MAJOR-6 before-hook
        # added in PR-7 (#943) calls `make check-release-invariants
        # VERSION={{ .Tag }}`. GoReleaser's `{{ .Tag }}` resolves via
        # `git describe --tags`, which prefers ANNOTATED tags over
        # lightweight ones. The v0.2.2 dispatch pushed `v0.2.2` as a
        # lightweight tag via REST (because release.yml's wait-for-pr-
        # merge timed out and the tag had to be pushed manually outside
        # the App-signed release-tool flow). Tag-all then created
        # annotated `file/v0.2.2`, `syslog/v0.2.2`, ..., `webhook/v0.2.2`
        # at the same SHA — and `git describe` picks the lexicographically
        # last annotated one (`webhook/v0.2.2`), which the Makefile
        # rejects as not matching any module's expected version.
        #
        # The proper fix (use $GITHUB_REF_NAME, or replace the
        # lightweight v0.2.2 tag with an annotated one) is tracked
        # for v0.2.3. For v0.2.2 we --skip=before — the invariant was
        # already enforced when PR #947 (the inter-module deps PR)
        # merged into main, so skipping the hook here is safe.
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: 'v2.15.4'
          # --skip=docker --skip=docker-manifests skips the docker
          # image build + push for v0.2.2. The audit-gen container
          # image isn't needed (consumers `go install` the binary),
          # and shipping it blocked v0.2.2 on a GHCR org-package-
          # creation permission chase. #953 tracks removing the
          # docker stanzas from .goreleaser.yml entirely; this flag
          # is the in-place workaround until that PR lands. The
          # cosign signs: stanza for checksums.txt is NOT skipped —
          # consumers' verifier recipe in docs/releasing.md still
          # needs the .sig + .pem files.
          args: release --clean --skip=validate --skip=before --skip=docker --skip=docker-manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR-11 (#951): GoReleaser's `{{ .Tag }}` and `{{ .Version }}`
          # templates resolve via `git describe --tags`, which prefers
          # ANNOTATED tags over lightweight ones. v0.2.2 was pushed as
          # lightweight (release-tool flow timed out at wait-for-pr-
          # merge, tag had to be created manually via REST), then
          # tag-all created annotated `file/v0.2.2`, ...,
          # `webhook/v0.2.2`. git describe picks the lexicographically
          # last annotated one (`webhook/v0.2.2`) — `{{ .Version }}`
          # becomes `webhook/v0.2.2`, and docker image-template builds
          # like `ghcr.io/axonops/audit-gen:{{ .Version }}-amd64`
          # produce `ghcr.io/...:webhook/v0.2.2-amd64`, an invalid
          # docker reference (slash in the tag).
          #
          # GORELEASER_CURRENT_TAG is goreleaser's documented escape
          # hatch — overrides the auto-detection. Set it to the
          # workflow_dispatch `version` input so .Tag / .Version
          # resolve to v0.2.2 / 0.2.2 regardless of what
          # `git describe` would pick.
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          # SBOM publishing intentionally removed (#514). Build provenance
          # attestations cover the binary distribution artifacts directly.
          # Cosign signature artifacts (#516) are also attested so the
          # build-provenance chain covers the signing material itself.
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
