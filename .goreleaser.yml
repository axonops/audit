version: 2

git:
  # Ignore sub-module tags (file/v*, syslog/v*, etc.) — only use the
  # core v* tag for versioning. Sub-module tags are on different commits
  # by design (three-tier release process).
  ignore_tags:
    - "file/*"
    - "syslog/*"
    - "webhook/*"
    - "loki/*"
    - "outputconfig/*"
    - "outputs/*"
    - "cmd/*"
    - "secrets/*"

builds:
  - id: audit-gen
    dir: cmd/audit-gen
    binary: audit-gen
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: audit-validate
    dir: cmd/audit-validate
    binary: audit-validate
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

before:
  hooks:
    # PR-7 (#943) MAJOR-6 fix: invariant check enabled. Pre-v0.2.0,
    # before-hooks were disabled because the tag commit's go.mod files
    # didn't necessarily reference the just-being-released versions.
    # v0.2.0+ runs the `update-deps-pr` job inside release.yml BEFORE
    # tagging, so the tag commit reliably has every inter-module
    # dependency pinned to {{ .Tag }}. Running the invariant check
    # here aborts the build early (with a clear FAIL line per offending
    # go.mod) if an out-of-band tag is pushed without going through
    # the release flow, instead of producing a broken artifact set.
    #
    # GoReleaser exec's hooks via `/bin/sh -c`: keep substitutions
    # whitespace-free. `{{ .Tag }}` (with the `v` prefix) is the
    # required form — the Makefile target compares string-equality
    # against `require` lines in every published go.mod, which all
    # carry the `v` prefix per Go-module convention. `{{ .Version }}`
    # (no prefix) would never match.
    - make check-release-invariants VERSION={{ .Tag }}

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^chore:'
      - '^docs:'
      - '^test:'
      - '^ci:'
  groups:
    - title: Breaking Changes
      regexp: '^.*!:'
      order: 0
    - title: Features
      regexp: '^feat'
      order: 1
    - title: Bug Fixes
      regexp: '^fix'
      order: 2
    - title: Security
      regexp: '^sec'
      order: 3
    - title: Refactoring
      regexp: '^refactor'
      order: 4

# SBOM publishing intentionally omitted — see #514 for rationale.
#
# This is a Go library; library consumers use `go get` against
# proxy.golang.org and rely on go.mod for their dependency manifest,
# which is the better SBOM-equivalent for libraries. The auxiliary
# CLI binaries (audit-gen, audit-validate) are operator tools rather
# than primary distribution artifacts. Build provenance for every
# released artifact is provided via GitHub build attestations
# (actions/attest-build-provenance, see release.yml job 2 and
# goreleaser.yml). Consumers verify with:
#
#     gh attestation verify <downloaded-artifact> --repo axonops/audit
#
# Operators wanting an SBOM of a downloaded binary can scan it
# locally with `syft scan <binary>`. The `make sbom` target produces
# a source-level SBOM for development purposes only.

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Sigstore keyless signing of the checksums file (#516).
#
# We sign checksums.txt — not every binary — because the checksum
# file is the cryptographic root of trust for every artifact in the
# release: a verified checksums.txt plus `sha256sum -c` extends the
# guarantee to every binary listed inside it. One bundle file
# (.bundle) protects the entire release manifest (#958 — cosign v2.6
# bundle format; the pre-#958 .sig + .pem split is retired).
#
# Identity: https://github.com/axonops/audit/.github/workflows/release.yml@refs/tags/<tag>
# Issuer:   https://token.actions.githubusercontent.com
# Rekor:    https://search.sigstore.dev/?logIndex=<index> — cosign
#           prints the index after signing; consumers can audit the
#           transparency-log entry independently of GitHub.
# Verify:   docs/releasing.md "Verify a Release with Cosign".
#
# `--yes` skips the keyless interactive prompt; cosign-installer
# in the release workflow makes the cosign binary available before
# this stanza runs.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    # New bundle-format signature artefact (#958). Replaces the
    # split sig + cert layout that PR #949 / #950 papered over with
    # cosign-v2.5 flag overrides + a cosign-installer pin. The
    # bundle is the cosign-v2.6 default; bundle format is forward-
    # compatible and the verifier recipe in docs/releasing.md is
    # updated accordingly.
    signature: '${artifact}.bundle'
    args:
      # Note: an explicit --oidc-issuer was previously passed here.
      # Modern cosign (≥ v2.5) treats explicit service URLs as
      # incompatible with the default signing-config and exits
      # with "cannot specify service URLs and use signing config".
      # In GitHub Actions the OIDC issuer is autodiscovered from
      # ACTIONS_ID_TOKEN_REQUEST_URL + ACTIONS_ID_TOKEN_REQUEST_TOKEN,
      # so dropping the flag yields identical behaviour and is
      # forward-compatible.
      - sign-blob
      - '--yes'
      # Single bundle output (#958). cosign-v2.6's new bundle format
      # writes the signature + certificate + Rekor entry into one
      # file via the --bundle flag. GoReleaser's `${signature}`
      # template resolves to the path declared in the `signature:`
      # field above (`${artifact}.bundle`).
      - '--bundle=${signature}'
      - '${artifact}'

release:
  github:
    owner: axonops
    name: audit
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: '{{ .Tag }}'
  # Ship the Grafana dashboards (#612) and the language-neutral
  # schema artefacts (#548) as release files so ops teams can
  # `gh release download v1.x.y -p 'audit-*'` without cloning the
  # repo. Grafana README is the import recipe; the framework-only
  # JSON Schema and CEF template document the wire shape for
  # non-Go consumers (SIEM rule authors, Python/Java services).
  extra_files:
    - glob: deploy/grafana/audit-events.json
    - glob: deploy/grafana/audit-metrics.json
    - glob: deploy/grafana/README.md
      name_template: 'grafana-dashboards-README.md'
    - glob: deploy/schemas/audit-event.framework.schema.json
    - glob: deploy/schemas/audit-event.framework.cef.template

# audit-gen OCI image publishing removed in #953. The library is the
# primary distribution surface (Go module proxy); audit-gen is a
# developer CLI tool consumers install via
# `go install github.com/axonops/audit/cmd/audit-gen@vX.Y.Z`. The
# docker image stanza was originally #610 but blocked the v0.2.2
# release on an org GHCR package-creation permission chase and added
# a recurring tax (login step, cosign-installer flag drift, .Tag
# template ambiguity vs annotated tags). docs/releasing.md no longer
# documents a docker recipe; consumers use the Go module + binary
# tarball + cosign checksum verification path.
