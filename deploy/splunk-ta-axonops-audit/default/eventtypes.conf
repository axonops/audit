# Generated by audit-gen --format=splunk-ta — DO NOT EDIT by hand.
# One eventtype per (category, event_type) pair in the taxonomy. The
# search matches either `action` (the CIM-canonical key written by
# CIMChangeFormatter) or `event_type` (the audit-canonical key kept
# by JSONFormatter), so the same TA works with either formatter.
#
# The search has no leading `index=` constraint and so runs across
# every index the searching user has access to. Operators routing
# audit events to a dedicated index (recommended for retention and
# access-control reasons) should prepend `index=<their-index>` in
# their own `local/eventtypes.conf` override for better search-time
# performance on busy clusters.

[account_user_create]
search = sourcetype="axonops:audit" (action="user_create" OR event_type="user_create")

[account_user_delete]
search = sourcetype="axonops:audit" (action="user_delete" OR event_type="user_delete")

[account_user_update]
search = sourcetype="axonops:audit" (action="user_update" OR event_type="user_update")

[configuration_config_update]
search = sourcetype="axonops:audit" (action="config_update" OR event_type="config_update")

[security_login_failure]
search = sourcetype="axonops:audit" (action="login_failure" OR event_type="login_failure")

[security_login_success]
search = sourcetype="axonops:audit" (action="login_success" OR event_type="login_success")

[security_logout]
search = sourcetype="axonops:audit" (action="logout" OR event_type="logout")

[security_permission_denied]
search = sourcetype="axonops:audit" (action="permission_denied" OR event_type="permission_denied")

