# Minimal taxonomy for the splunk_cim_test.go integration tests.
# Mirrors the relevant events from
# internal/schemagen/reference_ta_taxonomy.yaml but lives in the
# sub-module's own testdata so the splunk/ go.mod does not need to
# reach across the module boundary into the parent's internal/.

version: 1

categories:
  account:
    severity: 3
    events:
      - user_create
  security:
    severity: 8
    events:
      - login_success
      - login_failure

events:
  user_create:
    description: "A new user account was created"
    fields:
      outcome:
        required: true
      actor_id:
        required: true
      target_id:
        required: true
      target_type:
        required: true

  login_success:
    description: "A user authenticated successfully"
    fields:
      outcome:
        required: true
      actor_id:
        required: true
      source_ip:
        required: true

  login_failure:
    description: "An authentication attempt failed"
    fields:
      outcome:
        required: true
      actor_id:
        required: true
      source_ip:
        required: true
