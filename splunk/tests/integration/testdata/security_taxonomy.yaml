# Minimal taxonomy for the splunk_security_test.go integration tests.
# Declares a `pii` sensitivity label covering `email` and `ssn`. Used by
# the TestSplunkIntegration_SensitivityLabels_PIIExcluded test to prove
# that fields labelled `pii` are stripped from the wire payload when the
# output is wired with WithExcludeLabels("pii").

version: 1

categories:
  account:
    severity: 3
    events:
      - user_create

sensitivity:
  labels:
    pii:
      description: "Personally identifiable information"
      fields: [email, ssn]

events:
  user_create:
    description: "A new user account was created"
    fields:
      outcome:
        required: true
      actor_id:
        required: true
      target_id:
        required: true
      target_type:
        required: true
      email:
        labels: [pii]
      ssn:
        labels: [pii]
